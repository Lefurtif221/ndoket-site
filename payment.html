<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ndoket — Paiement</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5FAFC;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
  .card{background:#fff;border-radius:20px;padding:32px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);}
  .icon{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;}
  .icon.success{background:#DCF3E2;color:#3AA65A;}
  .icon.pending{background:#FDE3C5;color:#F2871E;}
  h1{font-size:18px;color:#1F2A33;margin-bottom:8px;}
  p{font-size:14px;color:#54646F;line-height:1.5;margin-bottom:20px;}
  .btn{display:inline-block;padding:14px 28px;border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;margin:4px;cursor:pointer;border:none;}
  .btn-orange{background:#F2871E;color:#fff;}
  .btn-ghost{background:#F5FAFC;color:#54646F;border:2px solid #E5EEF1;}
  .ref{font-size:12px;color:#8B98A1;margin-top:12px;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon pending" id="icon">⏳</div>
    <h1 id="title">Paiement en cours…</h1>
    <p id="msg">Ouverture de l'application Ndoket pour confirmer votre réservation.</p>
    <a class="btn btn-orange" id="openApp" style="display:none">Ouvrir Ndoket</a>
    <a class="btn btn-ghost" href="https://play.google.com/store/apps/details?id=com.ndoket.app">Télécharger l'app</a>
    <div class="ref" id="ref"></div>
  </div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var ref = params.get('ref') || '';
  var status = params.get('status') || 'success';
  document.getElementById('ref').textContent = ref ? 'Référence : ' + ref : '';

  if(status === 'cancel'){
    document.getElementById('icon').textContent = '❌';
    document.getElementById('icon').className = 'icon pending';
    document.getElementById('title').textContent = 'Paiement annulé';
    document.getElementById('msg').textContent = 'Aucun montant n\'a été débité.';
  } else {
    document.getElementById('icon').textContent = '✓';
    document.getElementById('icon').className = 'icon success';
    document.getElementById('title').textContent = 'Paiement confirmé !';
    document.getElementById('msg').textContent = 'Ouverture de l\'application pour afficher votre réservation.';
  }

  // Tenter d'ouvrir l'app via deep link
  var deepLink = 'ndoket://payment/' + (status === 'cancel' ? 'cancel' : 'success') + (ref ? '?ref=' + ref : '');
  var opened = false;
  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = deepLink;
  document.body.appendChild(iframe);
  setTimeout(function(){ document.getElementById('openApp').style.display = 'inline-block'; }, 1500);
  document.getElementById('openApp').onclick = function(){ location.href = deepLink; };
})();
</script>
</body>
</html>
